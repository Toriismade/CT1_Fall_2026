    <title>Button</title>
</head>
<body>
    <header> 
        <h1>Gallery</h1>
    </header>

    <main>
        <div class="small-image" id="imageButton">
           <button id="imageButton1">
              <img src="green.png" alt="green" width="80px" height="80px" />
           </button>
          <button id="imageButton2">
               <img src="blue.jpg" alt="blue" width="80px" height="80px" />
           </button>
           <button id="imageButtone3">
               <img src="yellow.jpg" alt="yellow" width="80px" height="80px" />
           </button>
           <button id="imageButtone4">
               <img src="purple.jpg" alt="purple" width="80px" height="80px" />
            </button>
        </div>

        <div class="big-image" id="Show">
            <img id="largeImage" src="green.png" alt="green" width="600px" height="600px" />
        </div>

        <script src="script.js"></script>
  
    </main>
</body>
